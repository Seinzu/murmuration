name: Sync norns package

on:
  push:
    branches:
      - main
    paths:
      - "norns/**"
      - "copy.bara.sky"
      - ".github/workflows/sync-norns.yml"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.repository == 'Seinzu/murmuration'

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Download Copybara
        run: |
          curl -L -o copybara.jar \
            https://github.com/google/copybara/releases/download/v20260608/copybara_deploy.jar

      - name: Configure Git author
        run: |
          git config --global user.name "murmuration sync"
          git config --global user.email "actions@github.com"

      - name: Configure GitHub credentials
        env:
          COPYBARA_GITHUB_TOKEN: ${{ secrets.COPYBARA_GITHUB_TOKEN }}
        run: |
          if [ -z "$COPYBARA_GITHUB_TOKEN" ]; then
            echo "COPYBARA_GITHUB_TOKEN is required to push to Seinzu/murmuration-norns" >&2
            exit 1
          fi
          git config --global url."https://x-access-token:${COPYBARA_GITHUB_TOKEN}@github.com/".insteadOf \
            "https://github.com/"

      - name: Sync norns package
        run: |
          java -jar copybara.jar migrate copy.bara.sky norns --force
